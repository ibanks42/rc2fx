[package]
name = "rc2fx-firmware"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Validated RC2FX firmware profiles and offline compatibility checks"

[features]
default = ["embedded-catalog"]
embedded-catalog = []

[[bin]]
name = "rc2fx-firmware"
path = "src/main.rs"
required-features = ["embedded-catalog"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
