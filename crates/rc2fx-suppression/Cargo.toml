[package]
name = "rc2fx-suppression"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Owned Rust bounded suppression worker and the DeepFilterNet engine"

[dependencies]
rc2fx-core = { path = "../rc2fx-core" }
rc2fx-dsp = { path = "../rc2fx-dsp" }
rc2fx-dfn = { path = "../rc2fx-dfn" }
libc = "0.2"

[features]
# For `rc2fx-bench` only: `rc2fx-dfn`'s run-time choice between its int8
# matrix kernels (`bench_kernels`). Production builds leave it off.
bench-kernels = ["rc2fx-dfn/bench-kernels"]

[dev-dependencies]
serde_json = "1"

