[package]
name = "rc2fx-transport"
version = "0.1.4"
edition = "2024"
publish = false
license.workspace = true

[features]
default = []
# A simulated mixer in place of USB 1, for working on the app without hardware.
# Development builds only: a release build with it refuses to compile.
mock-mixer = []

[dependencies]
rc2fx-installer = { path = "../rc2fx-installer" }
rc2fx-core = { path = "../rc2fx-core" }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
