[package]
name = "rc2fx-app"
version = "0.1.5"
edition = "2024"
publish = false
default-run = "rc2fx"
license.workspace = true

[[bin]]
name = "rc2fx"
path = "src/main.rs"

[features]
default = []
# Optional offline payload. Normal builds download authenticated mixer releases.
embedded = ["rc2fx-installer/embedded"]
# Run against a simulated mixer (`just app-mock`). Development builds only.
mock-mixer = ["rc2fx-transport/mock-mixer"]

[dependencies]
gpui-kit = { version = "=0.9.0", features = ["gpui-fast"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rc2fx-core = { path = "../rc2fx-core" }
rc2fx-transport = { path = "../rc2fx-transport" }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rc2fx-installer = { path = "../rc2fx-installer" }

# Pinned: 1.3 keeps downloaded package names inside the packages folder
# (velopack#1135) and signs with Azure Artifact Signing from any OS.
# public-utils names `bundle::Manifest`, which a custom update source's
# methods take.
velopack = { version = "=1.3.39-g8d2844f", features = ["public-utils"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3.0.12"
serde_json = "1"

[dev-dependencies]
gpui-test = { package = "gpui-fast", version = "=0.1.13", features = [
  "test-support",
] }
tempfile = "3"
