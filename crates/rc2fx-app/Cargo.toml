[package]
name = "rc2fx-app"
version = "0.1.4"
edition = "2024"
publish = false
default-run = "rc2fx"
license.workspace = true

[[bin]]
name = "rc2fx"
path = "src/main.rs"

[features]
default = []
# Optional offline payload. Normal builds download authenticated mixer releases.
embedded = ["rc2fx-installer/embedded"]
# Run against a simulated mixer (`just app-mock`). Development builds only.
mock-mixer = ["rc2fx-transport/mock-mixer"]

[dependencies]
gpui-kit = "=0.9.0"
image = { version = "0.25", default-features = false, features = ["png"] }
rc2fx-core = { path = "../rc2fx-core" }
rc2fx-transport = { path = "../rc2fx-transport" }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rc2fx-installer = { path = "../rc2fx-installer" }

[build-dependencies]
serde_json = "1"

[dev-dependencies]
gpui-test = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
tempfile = "3"
