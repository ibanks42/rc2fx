[package]
name = "rc2fx-app"
version = "1.0.0"
edition = "2024"
publish = false
default-run = "rc2fx"
license.workspace = true

[[bin]]
name = "rc2fx"
path = "src/main.rs"

[features]
default = ["embedded"]
# Embed the installer payload (the mixer runtime). Every real build does;
# `cargo check --no-default-features` checks the code without building it.
embedded = ["rc2fx-installer/embedded"]

[dependencies]
gpui-kit = "=0.8.0"
image = { version = "0.25", default-features = false, features = ["png"] }
rc2fx-core = { path = "../rc2fx-core" }
rc2fx-transport = { path = "../rc2fx-transport" }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rc2fx-installer = { path = "../rc2fx-installer" }

[build-dependencies]
serde_json = "1"

[dev-dependencies]
tempfile = "3"
