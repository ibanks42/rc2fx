# Licences accepted for RC2FX's release license reports (see THIRD_PARTY_NOTICES.md).
# Release targets: the mixer's ARM Linux. cargo-about covers only the mixer's
# Rust; the desktop app is Go.
targets = [
    "aarch64-unknown-linux-gnu",
]
# Build and dev tools are not shipped in a release.
ignore-build-dependencies = true
ignore-dev-dependencies = true
accepted = [
    "MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
    "Unicode-3.0", "CC0-1.0", "0BSD",
]
workarounds = ["ring"]
