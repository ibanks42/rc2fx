[workspace]
members = ["crates/rc2fx-usb", "crates/rc2fx-delta", "crates/rc2fx-core", "crates/rc2fx-dfn", "crates/rc2fx-device", "crates/rc2fx-dsp", "crates/rc2fx-suppression", "crates/rc2fx-native-control", "crates/rc2fx-firmware", "crates/rc2fx-supervisor"]
resolver = "3"

# zstd for the delta codec, with the C library built from the crate for the
# mixer's cross-build. (The desktop's encoder is Go: klauspost/compress.)
[workspace.dependencies]
zstd = "0.13"

[workspace.package]
edition = "2024"
version = "0.1.7"
publish = false
license = "MIT"

# Unoptimized dependencies (zstd, the DSP and DFN crates' maths) make the
# workspace tests slow. Optimize dependencies only; workspace crates keep fast
# rebuilds.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
