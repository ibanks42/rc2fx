[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Setup, mixer cross-build and mixer deployment: `cargo xtask help`"

[dependencies]
flate2 = "1"
object = { version = "0.37", default-features = false, features = ["read_core", "elf", "std"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
rc2fx-firmware = { path = "../crates/rc2fx-firmware" }
rc2fx-installer = { path = "../crates/rc2fx-installer" }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
rc2fx-usb = { path = "../crates/rc2fx-usb" }
