[book]
title = "RC2FX"
description = "Extra audio processing for the RØDECaster Pro II"
authors = ["Isaiah Banks"]
language = "en"
# The book reads docs/ in place: the release package (xtask/src/package.rs)
# and code comments link to those files by path.
src = "docs"

[build]
build-dir = "target/book"
# The crate chapters include crates/*/README.md, so `mdbook serve` rebuilds
# and reloads when those change too.
extra-watch-dirs = ["crates"]

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
