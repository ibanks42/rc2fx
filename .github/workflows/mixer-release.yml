name: Mixer release
run-name: Mixer release (${{ inputs.bump }})

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Mixer version bump, from the latest published mixer release
        type: choice
        default: patch
        options: [patch, minor, major]
      dry-run:
        description: Build and package without signing, pushing, or publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mixer-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Require protected main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/heads/main
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Bump config/mixer-release.json before building so the payload embeds it;
      # sign-and-publish commits the same bump to main.
      - name: Set the mixer version
        env:
          BUMP: ${{ inputs.bump }}
        run: python3 .github/scripts/mixer_version.py --bump "$BUMP"
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30
      - uses: actions/setup-go@v6.0.0
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            desktop/go.sum
            tools/xtask/go.sum
      - name: Set up verified Zig
        run: go -C tools/xtask run . fetch-zig "$RUNNER_TEMP/rc2fx-tools"
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: cargo-zigbuild@0.24.0,cargo-about@0.8.4
          fallback: none
      - name: Test and build the mixer payload
        run: |
          rustup component add rust-docs
          python3 .github/scripts/test_publish_mixer.py
          (cd tools/xtask && CGO_ENABLED=0 go test ./...)
          # Run installer tests with cgo enabled since storage repair links libext2fs.
          (cd desktop && go test ./installer/...)
          go -C tools/xtask run . mixer-build
          # Clear any cached target/mixer-release since mixer-package expects a fresh directory.
          rm -rf target/mixer-release
          go -C tools/xtask run . mixer-package target/mixer-release
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: unsigned-mixer
          path: target/mixer-release/
          if-no-files-found: error
          retention-days: 30

  sign-and-publish:
    needs: build
    # A dry run stops at the unsigned artifact: no signing keys, no push, no release.
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-24.04
    # Requires reviewers and main-only deployment; keep root keys offline.
    environment: mixer-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set the mixer version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: python3 .github/scripts/mixer_version.py --bump "$BUMP"
      # Disable build cache in jobs with signing key access; build from checkout + go.sum only.
      - uses: actions/setup-go@v6.0.0
        with:
          go-version-file: desktop/go.mod
          cache: false
      - name: Remove stale release outputs
        run: rm -rf target/mixer-release target/mixer-metadata
      - uses: actions/download-artifact@v8.0.2
        with:
          name: unsigned-mixer
          path: target/mixer-release
      - name: Build signing tool without signing credentials
        run: CGO_ENABLED=0 go -C tools/xtask build -o "$RUNNER_TEMP/rc2fx-xtask" .
      - name: Sign verified release payload
        env:
          MIXER_TARGETS_KEY: ${{ secrets.MIXER_TARGETS_KEY }}
          MIXER_SNAPSHOT_KEY: ${{ secrets.MIXER_SNAPSHOT_KEY }}
          MIXER_TIMESTAMP_KEY: ${{ secrets.MIXER_TIMESTAMP_KEY }}
        run: |
          umask 077
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          printf '%s' "$MIXER_TARGETS_KEY" > "$keydir/targets.pem"
          printf '%s' "$MIXER_SNAPSHOT_KEY" > "$keydir/snapshot.pem"
          printf '%s' "$MIXER_TIMESTAMP_KEY" > "$keydir/timestamp.pem"
          unset MIXER_TARGETS_KEY MIXER_SNAPSHOT_KEY MIXER_TIMESTAMP_KEY
          sequence=$(date -u +%s)
          expires=$(date -u -d '+7 days' +%Y-%m-%dT%H:%M:%SZ)
          RC2FX_XTASK_ROOT="$GITHUB_WORKSPACE" "$RUNNER_TEMP/rc2fx-xtask" mixer-sign config/mixer-update-root.json target/mixer-release target/mixer-metadata "$sequence" "$expires" "$keydir/targets.pem" "$keydir/snapshot.pem" "$keydir/timestamp.pem"
      # Keep signed metadata as an artifact so `publish_mixer.py --resume` can recover if publishing fails partway.
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: signed-mixer-metadata
          path: target/mixer-metadata/
          if-no-files-found: error
          retention-days: 7
      # Push the version bump. If main moved during the build only by an app
      # version commit, rebase on top of it; any other change stops the release.
      - name: Commit the mixer version to main
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          CHANGED: ${{ steps.version.outputs.changed }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ "$CHANGED" != true ]; then
            echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --only -m "chore(mixer-release): $VERSION" -- config/mixer-release.json
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          python3 .github/scripts/land_release.py --kind mixer --source "$SOURCE_SHA" --remote "$remote"
      - name: Verify uploads and publish payload before discovery metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ steps.commit.outputs.sha }}
        run: python3 .github/scripts/publish_mixer.py target/mixer-release target/mixer-metadata
