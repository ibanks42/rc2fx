name: Mixer release
run-name: Mixer release (${{ inputs.bump }})

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Mixer version bump, from the latest published mixer release
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: read

concurrency:
  group: mixer-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Require protected main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/heads/main
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The payload carries config/mixer-release.json, so the version is set
      # before the build; sign-and-publish commits the same change to main.
      - name: Set the mixer version
        env:
          BUMP: ${{ inputs.bump }}
        run: python3 .github/scripts/mixer_version.py --bump "$BUMP"
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30
      # ./xtask is Go; the mixer it builds is Rust.
      - uses: actions/setup-go@v6.0.0
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - name: Set up verified Zig
        run: bash .github/scripts/setup-release-tools.sh zig
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: cargo-zigbuild@0.24.0,cargo-about@0.8.4
          fallback: none
      - name: Test and build the mixer payload
        run: |
          rustup component add rust-docs
          python3 .github/scripts/test_publish_mixer.py
          (cd desktop && CGO_ENABLED=0 go test ./internal/xtask/...)
          # With cgo, as the app builds it: the storage repair links libext2fs.
          (cd desktop && go test ./installer/...)
          ./xtask mixer-build
          # The Rust cache restores target/ from the previous run, and the
          # packager refuses to write into an existing directory.
          rm -rf target/mixer-release
          ./xtask mixer-package target/mixer-release
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: unsigned-mixer
          path: target/mixer-release/
          if-no-files-found: error
          retention-days: 30

  sign-and-publish:
    needs: build
    runs-on: ubuntu-24.04
    # Configure required reviewers and main-only deployment before use. Only
    # release-role keys belong here; root keys must remain offline.
    environment: mixer-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set the mixer version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: python3 .github/scripts/mixer_version.py --bump "$BUMP"
      # No build cache where release keys are in reach: the tool is built
      # from this checkout and go.sum alone.
      - uses: actions/setup-go@v6.0.0
        with:
          go-version-file: desktop/go.mod
          cache: false
      - name: Remove stale release outputs
        # The signer refuses an existing metadata directory, and a stale
        # payload directory must not be merged with the downloaded one.
        run: rm -rf target/mixer-release target/mixer-metadata
      - uses: actions/download-artifact@v8.0.2
        with:
          name: unsigned-mixer
          path: target/mixer-release
      - name: Build signing tool without signing credentials
        run: CGO_ENABLED=0 go -C desktop build -o "$RUNNER_TEMP/rc2fx-xtask" ./cmd/xtask
      - name: Sign verified release payload
        env:
          MIXER_TARGETS_KEY: ${{ secrets.MIXER_TARGETS_KEY }}
          MIXER_SNAPSHOT_KEY: ${{ secrets.MIXER_SNAPSHOT_KEY }}
          MIXER_TIMESTAMP_KEY: ${{ secrets.MIXER_TIMESTAMP_KEY }}
        run: |
          umask 077
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          printf '%s' "$MIXER_TARGETS_KEY" > "$keydir/targets.pem"
          printf '%s' "$MIXER_SNAPSHOT_KEY" > "$keydir/snapshot.pem"
          printf '%s' "$MIXER_TIMESTAMP_KEY" > "$keydir/timestamp.pem"
          unset MIXER_TARGETS_KEY MIXER_SNAPSHOT_KEY MIXER_TIMESTAMP_KEY
          sequence=$(date -u +%s)
          expires=$(date -u -d '+7 days' +%Y-%m-%dT%H:%M:%SZ)
          RC2FX_XTASK_ROOT="$GITHUB_WORKSPACE" "$RUNNER_TEMP/rc2fx-xtask" mixer-sign config/mixer-update-root.json target/mixer-release target/mixer-metadata "$sequence" "$expires" "$keydir/targets.pem" "$keydir/snapshot.pem" "$keydir/timestamp.pem"
      # Public signed files: if publication stops after the payload, --resume
      # needs these, because a published release can't be published again.
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: signed-mixer-metadata
          path: target/mixer-metadata/
          if-no-files-found: error
          retention-days: 7
      # As the app's Release does: the version goes to main only if main is
      # still the commit this run built, and the release is tagged there.
      - name: Commit the mixer version to main
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          CHANGED: ${{ steps.version.outputs.changed }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ "$CHANGED" != true ]; then
            echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --only -m "chore(mixer-release): $VERSION" -- config/mixer-release.json
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q "$remote" main
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA" || {
            echo 'main changed during the build. Start a new mixer release run.'
            exit 1
          }
          git push -q "$remote" HEAD:refs/heads/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify uploads and publish payload before discovery metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ steps.commit.outputs.sha }}
        run: python3 .github/scripts/publish_mixer.py target/mixer-release target/mixer-metadata
