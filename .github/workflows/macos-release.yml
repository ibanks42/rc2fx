name: Release macOS
run-name: Release macOS (release run ${{ github.event.workflow_run.id || inputs.run-id }})

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      run-id:
        description: Original successful Release run ID (resume its draft and reuse its payload)
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: macos-release-${{ github.event.workflow_run.id || inputs.run-id }}
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # GitHub only exposes draft releases to tokens with push access.
    permissions:
      contents: write
      actions: read
    outputs:
      ready: ${{ steps.release.outputs.ready }}
      source: ${{ steps.release.outputs.source }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate the original release draft
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_RUN: ${{ github.event.workflow_run.id || inputs.run-id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=()
          if test "$EVENT_NAME" = workflow_run; then args+=(--automatic); fi
          python3 .github/scripts/macos_release.py prepare --run-id "$RELEASE_RUN" "${args[@]}"

  build:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
          rustflags: ""
      - name: Install standard-library license notices
        run: rustup component add rust-docs
      - uses: actions/cache@v6.1.0
        id: desktop-tools
        with:
          path: ~/.cargo/bin/cargo-about*
          key: release-tools-${{ runner.os }}-${{ runner.arch }}-about0.8.4
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        if: steps.desktop-tools.outputs.cache-hit != 'true'
        with:
          tool: cargo-about@0.8.4
          fallback: none
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-input
          path: .release-input
          run-id: ${{ github.event.workflow_run.id || inputs.run-id }}
          github-token: ${{ github.token }}
      - name: Apply the original release version
        env:
          RELEASE_SOURCE: ${{ needs.prepare.outputs.source }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 .github/scripts/macos_release.py stage --source "$RELEASE_SOURCE" --tag "$RELEASE_TAG"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-desktop
          cache-bin: false
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Build macOS release package
        env:
          RC2FX_RELEASE_BUILD: "1"
        run: cargo xtask package
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: macos-package
          path: target/package/rc2fx-*-macos-arm64.zip
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-publication
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: macos-package
          path: target/macos-assets
      - name: Complete, verify and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SOURCE: ${{ needs.prepare.outputs.source }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 .github/scripts/macos_release.py publish --tag "$RELEASE_TAG" --source "$RELEASE_SOURCE" --package-dir target/macos-assets
      - name: Dispatch the release documentation deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run docs.yml --ref main -f source=latest-release
