name: Release macOS
run-name: Release macOS (release run ${{ github.event.workflow_run.id || inputs.run-id }})

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      run-id:
        description: Original successful Release run ID (resume its draft and reuse its payload)
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: macos-release-${{ github.event.workflow_run.id || inputs.run-id }}
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # GitHub only exposes draft releases to tokens with push access.
    permissions:
      contents: write
      actions: read
    outputs:
      ready: ${{ steps.release.outputs.ready }}
      prebuilt: ${{ steps.release.outputs.prebuilt }}
      source: ${{ steps.release.outputs.source }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate the original release draft
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_RUN: ${{ github.event.workflow_run.id || inputs.run-id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=()
          if test "$EVENT_NAME" = workflow_run; then args+=(--automatic); fi
          python3 .github/scripts/macos_release.py prepare --run-id "$RELEASE_RUN" "${args[@]}"

  # Only when the Release run's own macOS job left no package.
  build:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true' && needs.prepare.outputs.prebuilt != 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-input
          path: .release-input
          run-id: ${{ github.event.workflow_run.id || inputs.run-id }}
          github-token: ${{ github.token }}
      - name: Apply the original release version
        env:
          RELEASE_SOURCE: ${{ needs.prepare.outputs.source }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 .github/scripts/macos_release.py stage --source "$RELEASE_SOURCE" --tag "$RELEASE_TAG"
      - uses: ./.github/actions/macos-package
        with:
          certificate: ${{ secrets.MACOS_CERTIFICATE }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          notary-key: ${{ secrets.MACOS_NOTARY_KEY }}
          notary-key-id: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          notary-issuer: ${{ secrets.MACOS_NOTARY_ISSUER }}

  publish:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.outputs.ready == 'true' && contains(fromJSON('["success", "skipped"]'), needs.build.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-publication
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: macos-package
          path: target/macos-assets
          run-id: ${{ needs.prepare.outputs.prebuilt == 'true' && (github.event.workflow_run.id || inputs.run-id) || github.run_id }}
          github-token: ${{ github.token }}
      - name: Complete, verify and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SOURCE: ${{ needs.prepare.outputs.source }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 .github/scripts/macos_release.py publish --tag "$RELEASE_TAG" --source "$RELEASE_SOURCE" --package-dir target/macos-assets
      - name: Dispatch the release documentation deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run docs.yml --ref main -f source=latest-release
