name: Sign app release metadata

# Called by Release after publishing an app release to sign its assets into the
# `app-metadata` branch (used by the desktop app to verify updates). Can also be
# re-run or dispatched manually for an existing release; re-signing identical
# assets is a no-op and downgrades are rejected (see docs/developer/releases.md).
on:
  workflow_call:
    inputs:
      tag:
        description: The published app release tag, such as v1.2.3
        required: true
        type: string
      # Release passes true to ensure we only sign packages built by this run
      # (called workflows share the caller's artifacts).
      expect-artifacts:
        description: Require the release to hold exactly this run's built packages
        required: false
        type: boolean
        default: false
  # Manual dispatch verifies the release against GitHub digests only.
  workflow_dispatch:
    inputs:
      tag:
        description: The published app release tag, such as v1.2.3
        required: true
        type: string

permissions:
  contents: read

jobs:
  sign:
    # Kill switch in case a signing key is compromised.
    if: vars.APP_UPDATES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Shares the mixer release keys and reviewers; keep root keys offline.
    environment: mixer-signing
    permissions:
      contents: write
    # Serialize writes to app-metadata with the renewal workflow.
    concurrency:
      group: app-metadata
      cancel-in-progress: false
    steps:
      - name: Require main
        env:
          CURRENT_REF: ${{ github.ref }}
        run: test "$CURRENT_REF" = refs/heads/main
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Disable build cache in jobs with signing key access; build from checkout + go.sum only.
      - uses: actions/setup-go@v6.0.0
        with:
          go-version-file: desktop/go.mod
          cache: false
      - name: Test the publication tooling
        run: python3 .github/scripts/test_app_release.py
      - uses: actions/download-artifact@v8.0.2
        if: inputs.expect-artifacts
        with:
          name: release-assets
          path: target/built/release-assets
      - name: Download and check the published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          EXPECT_ARTIFACTS: ${{ inputs.expect-artifacts }}
        run: |
          rm -rf target/app-release target/app-metadata
          built=()
          if [ "$EXPECT_ARTIFACTS" = true ]; then
            built=(--built target/built/release-assets)
          fi
          python3 .github/scripts/publish_app.py prepare --tag "$TAG" --dir target/app-release "${built[@]}"
      - name: Build signing tool without signing credentials
        if: steps.release.outputs.sign == 'true'
        run: CGO_ENABLED=0 go -C desktop build -o "$RUNNER_TEMP/rc2fx-xtask" ./cmd/xtask
      - name: Sign the release assets
        if: steps.release.outputs.sign == 'true'
        env:
          MIXER_TARGETS_KEY: ${{ secrets.MIXER_TARGETS_KEY }}
          MIXER_SNAPSHOT_KEY: ${{ secrets.MIXER_SNAPSHOT_KEY }}
          MIXER_TIMESTAMP_KEY: ${{ secrets.MIXER_TIMESTAMP_KEY }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          umask 077
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          printf '%s' "$MIXER_TARGETS_KEY" > "$keydir/targets.pem"
          printf '%s' "$MIXER_SNAPSHOT_KEY" > "$keydir/snapshot.pem"
          printf '%s' "$MIXER_TIMESTAMP_KEY" > "$keydir/timestamp.pem"
          unset MIXER_TARGETS_KEY MIXER_SNAPSHOT_KEY MIXER_TIMESTAMP_KEY
          # Offset below Unix timestamps used by mixer metadata so app metadata
          # can't be replayed as mixer metadata.
          sequence=$(( $(date -u +%s) - 1000000000 ))
          expires=$(date -u -d '+7 days' +%Y-%m-%dT%H:%M:%SZ)
          RC2FX_XTASK_ROOT="$GITHUB_WORKSPACE" "$RUNNER_TEMP/rc2fx-xtask" app-sign config/mixer-update-root.json target/app-release "$VERSION" target/app-metadata "$sequence" "$expires" "$keydir/targets.pem" "$keydir/snapshot.pem" "$keydir/timestamp.pem"
      - name: Commit the signed metadata to the metadata branch
        if: steps.release.outputs.sign == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: python3 .github/scripts/publish_app.py publish --tag "$TAG" target/app-release target/app-metadata
