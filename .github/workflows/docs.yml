name: Docs

# Builds and deploys the docs site only.
on:
  workflow_dispatch:
    inputs:
      source:
        description: Publish current main docs or the latest published release snapshot
        type: choice
        options: [main, latest-release]
        default: main

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Keep build and deploy in one job so retrying a failed deploy re-resolves
    # the source and rebuilds instead of reusing a stale Pages artifact.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require a main-branch dispatch
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: test "$DISPATCH_REF" = refs/heads/main
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: ${{ inputs.source == 'latest-release' && 1 || 0 }}
          persist-credentials: false
      - name: Resolve the current documentation source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DOCS_SOURCE: ${{ inputs.source }}
        run: python3 .github/scripts/docs_source.py
      - uses: actions/checkout@v7.0.1
        if: steps.source.outputs.ref != 'refs/heads/main'
        with:
          ref: ${{ steps.source.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Build
        working-directory: docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: target/docs
      # The run's artifact list can lag the upload by a moment, and
      # deploy-pages fails at once if the artifact isn't listed yet.
      - name: Wait for the artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT: github-pages-${{ github.run_attempt }}
        run: |
          for _ in $(seq 30); do
            count=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts?name=$ARTIFACT" --jq .total_count)
            if [ "$count" -gt 0 ]; then exit 0; fi
            sleep 1
          done
          echo "::error::$ARTIFACT was not listed after 30 s"
          exit 1

      - id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
