name: Release
run-name: Release (${{ inputs.bump }})

on:
  workflow_dispatch:
    inputs:
      bump:
        description: App version bump (first release uses the checked-in version)
        type: choice
        default: patch
        options: [patch, minor, major]
      dry-run:
        description: Build without pushing or publishing
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Require main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/heads/main
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: git-cliff@2.14.1
          fallback: none
      - name: Bump version and prepare notes
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: python3 .github/scripts/release.py prepare --bump "$BUMP" --preserve-initial-notes
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Validate candidate release notes and build documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm ci --prefix docs --no-audit --no-fund
          # prepare validates pending notes. The site build always exposes
          # published history only, even while validating a future release.
          npm run build --prefix docs
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-input
          retention-days: 90
          path: target/release-input/
          if-no-files-found: error

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Build against a fixed glibc baseline, not a moving runner image.
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sh .github/scripts/linux-build-deps.sh
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
          rustflags: ""
      - name: Install standard-library license notices
        run: rustup component add rust-docs
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-about@0.8.4
          fallback: none
      - uses: actions/cache@v6.1.0
        if: runner.os == 'Linux'
        with:
          path: ~/.cache/rc2fx-release-tools/appimage
          key: release-appimage-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/scripts/setup-release-tools.sh') }}
      - name: Set up verified AppImage tools
        if: runner.os == 'Linux'
        run: bash .github/scripts/setup-release-tools.sh appimage
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-input
          path: .release-input
      - name: Apply release version
        run: tar -xf .release-input/versioned.tar
      # Key the cache against the manifests actually being compiled.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-desktop
          cache-bin: false
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Prepare AppImage runtime licenses and corresponding sources
        if: runner.os == 'Linux'
        run: |
          python3 .github/scripts/test_prepare_appimage_notices.py
          python3 .github/scripts/prepare-appimage-notices.py
      - name: Build release package
        env:
          RC2FX_RELEASE_BUILD: "1"
        run: cargo xtask package
      - name: Test Linux package installation and AppImage contents
        if: runner.os == 'Linux'
        env:
          CONTAINER_ENGINE: docker
        run: bash .github/scripts/test-linux-packages.sh target/package
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: rc2fx-package-${{ matrix.os }}
          path: |
            target/package/*.AppImage
            target/package/*.deb
            target/package/*.rpm
            target/package/*.zip
            target/package/rc2fx-*-appimage-runtime-sources.tar.gz
          if-no-files-found: error

  # Beside the other platforms; only publish waits for it. If it fails, the
  # draft stays unpublished: re-run the failed jobs.
  macos:
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-input
          path: .release-input
      - name: Apply release version
        run: tar -xf .release-input/versioned.tar
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
          rustflags: ""
      - name: Install standard-library license notices
        run: rustup component add rust-docs
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-about@0.8.4
          fallback: none
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-desktop
          cache-bin: false
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Load the Apple signing credentials
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: bash .github/scripts/macos-signing.sh
      - name: Build macOS release package
        env:
          RC2FX_RELEASE_BUILD: "1"
        run: cargo xtask package
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: macos-package
          path: target/package/rc2fx-*-macos-arm64.zip
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-input
          path: target/release-input
      - name: Apply version and changelog
        run: tar -xf target/release-input/versioned.tar
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: rc2fx-package-*
          merge-multiple: true
          path: target/release-assets
      - name: Check archives and generate SHA256SUMS
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import zipfile
          import tarfile
          import tomllib

          directory = Path('target/release-assets')
          archives = sorted(directory.iterdir())
          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          prefix = f'rc2fx-{version}'
          sources_name = f'{prefix}-appimage-runtime-sources.tar.gz'
          expected = {f'{prefix}-linux-x64.AppImage', f'{prefix}-linux-x64.deb', f'{prefix}-linux-x64.rpm',
                      f'{prefix}-windows-x64.zip', sources_name}
          assert {p.name for p in archives} == expected, 'Missing or unexpected release package'
          for archive in archives:
              assert archive.name.startswith('rc2fx-'), archive
              if archive.name == sources_name:
                  with tarfile.open(archive, 'r:gz') as sources:
                      assert sources.getmembers(), 'Empty runtime source archive'
              elif archive.suffix == '.AppImage':
                  with archive.open('rb') as stream:
                      header = stream.read(11)
                  assert header[:4] == b'\x7fELF' and header[8:11] == b'AI\x02', 'Invalid AppImage'
              elif archive.suffix in {'.deb', '.rpm'}:
                  with archive.open('rb') as stream:
                      header = stream.read(8)
                  assert header.startswith(b'!<arch>\n' if archive.suffix == '.deb' else bytes.fromhex('edabeedb')), 'Invalid native package'
              else:
                  assert archive.suffix == '.zip', archive
                  with zipfile.ZipFile(archive) as package:
                      assert package.testzip() is None
          sums = ''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in archives)
          (directory / 'SHA256SUMS').write_text(sums)
          print(sums)
          PY
      - name: Commit version and create local tag
        run: python3 .github/scripts/release.py commit
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-assets
          path: target/release-assets/
          if-no-files-found: error
      - name: Push version and tag
        if: ${{ !inputs.dry-run }}
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA" || {
            echo 'main changed during the build. Start a new release run.'
            exit 1
          }
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"
      - name: Create draft release and upload Linux and Windows packages
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          cat >> target/release-input/release-notes.md <<'EOF'

          <!-- rc2fx:macos-pending -->
          macOS build is pending. This draft will publish only after all platform packages are verified.
          <!-- /rc2fx:macos-pending -->
          EOF
          gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file target/release-input/release-notes.md
          gh release upload "$TAG" target/release-assets/*

  # Adds the macOS package to the draft, verifies every package and checksum,
  # and publishes the release as latest, last of all.
  publish:
    needs: [prepare, macos, release]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-publication
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: macos-package
          path: target/macos-assets
      - name: Complete, verify and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SOURCE: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 .github/scripts/macos_release.py publish --tag "$RELEASE_TAG" --source "$RELEASE_SOURCE" --package-dir target/macos-assets
      - name: Dispatch the release documentation deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run docs.yml --ref main -f source=latest-release
