name: Release
run-name: Release (${{ inputs.bump }})

on:
  workflow_dispatch:
    inputs:
      bump:
        description: App version bump
        type: choice
        default: patch
        options: [patch, minor, major]
      dry-run:
        description: Build without pushing or publishing
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Require main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/heads/main
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # Fail early if any shipped platform is missing a goui-kit SHA-256 pin.
      - name: Require a goui-kit pin for every shipped platform
        run: |
          missing=
          for platform in windows-x86_64 linux-x86_64 macos-universal; do
            grep -Eq "\"$platform\": *\"[0-9a-f]{64}\"" config/goui-kit.json || missing="$missing $platform"
          done
          if [ -n "$missing" ]; then
            echo "::error::config/goui-kit.json has no SHA-256 for:$missing"
            exit 1
          fi
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: git-cliff@2.14.1
          fallback: none
      - name: Bump version and prepare notes
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: python3 .github/scripts/release.py prepare --bump "$BUMP"
      # Generate platform-independent base license notices (Rust crates, stdlib,
      # Velopack) once here so Windows and macOS jobs don't need Rust or cargo-about.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
          rustflags: ""
      - name: Install standard-library license notices
        run: rustup component add rust-docs
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-about@0.8.4
          fallback: none
      - uses: actions/setup-go@v6.0.0
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - name: Generate base license notices
        run: go -C tools/xtask run . licenses --base target/release-input/base-licenses.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Validate candidate release notes and build documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm ci --prefix docs --no-audit --no-fund
          # Site build only publishes released history, even when validating pending notes.
          npm run build --prefix docs
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-input
          retention-days: 90
          path: target/release-input/
          if-no-files-found: error

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      # Azure Artifact Signing signs in through GitHub's OIDC token.
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-input
          path: .release-input
      - name: Apply release version
        run: tar -xf .release-input/versioned.tar
      # Go + cgo against goui-kit and velopack_libc (base notices come from prepare).
      - uses: actions/setup-go@v6.0.0
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - name: Fetch goui-kit
        run: go -C tools/xtask run . fetch-goui-kit windows-amd64
      - name: Fetch the Velopack C library
        run: go -C tools/xtask run . fetch-velopack windows-amd64
      # MinGW gcc + lld strips unused goui-kit components; windres embeds icon/version info.
      - name: Check the C toolchain
        run: gcc --version && ld.lld --version && windres --version
      # vpk packages and signs with Azure Artifact Signing when configured.
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Set up verified vpk
        run: go -C tools/xtask run . fetch-vpk
      - name: Check the Windows signing settings
        id: windows-signing
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: go -C tools/xtask run . windows-signing
      # Delay Azure login until after the build so the OIDC token is fresh for signing.
      - name: Build the Windows release executable
        env:
          RC2FX_RELEASE_BUILD: "1"
          RC2FX_BASE_LICENSES: .release-input/base-licenses.json
        run: go -C tools/xtask run . package --build-only
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: steps.windows-signing.outputs.enabled == 'true'
        with:
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          # The signing app holds a role on the certificate profile only.
          allow-no-subscriptions: true
      - name: Sign and package the Windows release
        env:
          RC2FX_RELEASE_BUILD: "1"
          RC2FX_BASE_LICENSES: .release-input/base-licenses.json
        run: go -C tools/xtask run . package --skip-build
      - name: Verify the Windows signatures
        if: steps.windows-signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $nupkg = @(Get-ChildItem target/package/io.github.ibanks42.rc2fx-*-full.nupkg)
          $setup = @(Get-ChildItem target/package/rc2fx-windows-x64-setup.exe)
          if ($nupkg.Count -ne 1 -or $setup.Count -ne 1) { throw "Expected one Windows nupkg and one setup, found $($nupkg.Count) and $($setup.Count)" }
          $dir = Join-Path $env:RUNNER_TEMP rc2fx-signature-check
          Remove-Item -Recurse -Force $dir -ErrorAction Ignore
          [System.IO.Compression.ZipFile]::ExtractToDirectory($nupkg[0].FullName, $dir)
          # Verify launcher stub, updater, app binary, Velopack DLL, and setup executable.
          $files = @('lib/app/RC2FX_ExecutionStub.exe', 'lib/app/Squirrel.exe', 'lib/app/rc2fx.exe', 'lib/app/velopack_libc.dll' | ForEach-Object { Get-Item (Join-Path $dir $_) }) + $setup
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid') { throw "$($file.Name) signature is $($signature.Status): $($signature.StatusMessage)" }
            if (-not $signature.TimeStamperCertificate) { throw "$($file.Name) signature has no timestamp" }
            Write-Host "$($file.Name) signed by $($signature.SignerCertificate.Subject)"
          }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: rc2fx-package-windows
          path: |
            target/package/rc2fx-windows-x64-setup.exe
            target/package/io.github.ibanks42.rc2fx-*-full.nupkg
            target/package/releases.win.json
          if-no-files-found: error

  # AlmaLinux 8 build image (glibc 2.28), published by build-image.yml.
  image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml

  # Build the AppImage in the AlmaLinux 8 container and verify it across distros.
  linux:
    needs: [prepare, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Keep release-input outside the worktree since package-check snapshots the tree.
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-input
          path: ${{ runner.temp }}/release-input
      - name: Apply release version
        env:
          RELEASE_INPUT: ${{ runner.temp }}/release-input
        run: tar -xf "$RELEASE_INPUT/versioned.tar"
      - uses: actions/setup-go@v6.0.0
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - name: Sign in to the container registry
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Build and test the AppImage
        env:
          CONTAINER_ENGINE: docker
          RC2FX_BUILD_IMAGE: ${{ needs.image.outputs.image }}
        run: go -C tools/xtask run . package-check
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: rc2fx-package-linux
          path: |
            target/package-check/target/package/rc2fx-linux-x64.AppImage
            target/package-check/target/package/io.github.ibanks42.rc2fx-*-linux-full.nupkg
            target/package-check/target/package/releases.linux.json
            target/package-check/target/package/rc2fx-*-appimage-runtime-sources.tar.gz
          if-no-files-found: error

  # Runs in parallel with Windows/Linux; release waits for all three.
  macos:
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-input
          path: .release-input
      - name: Apply release version
        run: tar -xf .release-input/versioned.tar
      # Universal Go + cgo build (arm64 + x86_64 joined with lipo); base notices come from prepare.
      - uses: actions/setup-go@v6.0.0
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - name: Fetch goui-kit
        run: go -C tools/xtask run . fetch-goui-kit darwin-universal
      - name: Fetch the Velopack C library
        run: go -C tools/xtask run . fetch-velopack darwin-universal
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Set up verified vpk
        run: go -C tools/xtask run . fetch-vpk
      - name: Load the Apple signing credentials
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
          MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: go -C tools/xtask run . macos-signing
      - name: Build macOS release package
        env:
          RC2FX_RELEASE_BUILD: "1"
          RC2FX_BASE_LICENSES: .release-input/base-licenses.json
        run: go -C tools/xtask run . package
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: rc2fx-package-macos
          path: |
            target/package/rc2fx-macos-universal.pkg
            target/package/io.github.ibanks42.rc2fx-*-osx-full.nupkg
            target/package/releases.osx.json
          if-no-files-found: error

  release:
    needs: [prepare, windows, linux, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-input
          path: target/release-input
      - name: Apply version and changelog
        run: tar -xf target/release-input/versioned.tar
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: rc2fx-package-*
          merge-multiple: true
          path: target/release-assets
      - name: Check release packages
        run: python3 .github/scripts/release.py verify --dir target/release-assets
      - name: Commit version and create local tag
        run: python3 .github/scripts/release.py commit
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-assets
          path: target/release-assets/
          if-no-files-found: error
      - name: Push version and tag
        if: ${{ !inputs.dry-run }}
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
        # Rebase over a mixer version commit that landed during the build; any
        # other change to main stops the release.
        run: python3 .github/scripts/land_release.py --kind app --source "$SOURCE_SHA" --tag "$TAG"
      - name: Create and publish release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        # Upload everything into a draft first so any upload failure leaves the
        # release unpublished (and safe with immutable releases enabled).
        run: |
          gh release create "$TAG" --verify-tag --draft --title "$TAG" \
            --notes-file target/release-input/release-notes.md \
            target/release-assets/*
          gh release edit "$TAG" --tag "$TAG" --draft=false --latest

  # Separate job so a docs dispatch failure never blocks update-metadata signing.
  docs:
    needs: [release]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the release documentation deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run docs.yml --ref main -f source=latest-release

  # Sign the published release into the app update metadata.
  app-metadata:
    needs: [prepare, release]
    if: ${{ !inputs.dry-run }}
    permissions:
      contents: write
    uses: ./.github/workflows/app-metadata-sign.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      # Sign only the packages this run built and published.
      expect-artifacts: true
    secrets: inherit
