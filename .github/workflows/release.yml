name: Release
run-name: Release (${{ inputs.bump }})

on:
  workflow_dispatch:
    inputs:
      bump:
        description: App version bump (first release uses the checked-in version)
        type: choice
        default: patch
        options: [patch, minor, major]
      dry-run:
        description: Build without pushing or publishing
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Require main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/heads/main
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: git-cliff@2.14.1
          fallback: none
      - name: Bump version and prepare notes
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: python3 .github/scripts/release.py prepare --bump "$BUMP" --preserve-initial-notes
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Validate candidate release notes and build documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm ci --prefix docs --no-audit --no-fund
          # prepare validates pending notes. The site build always exposes
          # published history only, even while validating a future release.
          npm run build --prefix docs
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-input
          retention-days: 90
          path: target/release-input/
          if-no-files-found: error

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      # Azure Artifact Signing signs in through GitHub's OIDC token.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
          rustflags: ""
      - name: Install standard-library license notices
        run: rustup component add rust-docs
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-about@0.8.4
          fallback: none
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-input
          path: .release-input
      - name: Apply release version
        run: tar -xf .release-input/versioned.tar
      # Key the cache against the manifests actually being compiled.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-desktop
          cache-bin: false
          cache-workspace-crates: true
          cache-on-failure: true
      # Velopack's vpk makes the packages and signs them, with Azure Artifact
      # Signing when the signing variables are set.
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Set up verified vpk
        run: bash .github/scripts/setup-vpk.sh
      - name: Check the Windows signing settings
        id: windows-signing
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: .github/scripts/windows-signing.ps1
      # Sign in to Azure only after the long build, so the session is fresh
      # when signing starts.
      - name: Build the Windows release executable
        env:
          RC2FX_RELEASE_BUILD: "1"
        run: cargo xtask package --build-only
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: steps.windows-signing.outputs.enabled == 'true'
        with:
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          # The signing app holds a role on the certificate profile only.
          allow-no-subscriptions: true
      - name: Sign and package the Windows release
        env:
          RC2FX_RELEASE_BUILD: "1"
        run: cargo xtask package --skip-build
      - name: Verify the Windows signatures
        if: steps.windows-signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem target/package/rc2fx-windows-x64.zip)
          $setup = @(Get-ChildItem target/package/rc2fx-windows-x64-setup.exe)
          if ($zip.Count -ne 1 -or $setup.Count -ne 1) { throw "Expected one Windows zip and one setup, found $($zip.Count) and $($setup.Count)" }
          $dir = Join-Path $env:RUNNER_TEMP rc2fx-signature-check
          Remove-Item -Recurse -Force $dir -ErrorAction Ignore
          Expand-Archive $zip[0].FullName -DestinationPath $dir
          # The launcher, the updater, the app itself, and Setup.
          $files = @('RC2FX.exe', 'Update.exe', 'current/rc2fx.exe' | ForEach-Object { Get-Item (Join-Path $dir $_) }) + $setup
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid') { throw "$($file.Name) signature is $($signature.Status): $($signature.StatusMessage)" }
            if (-not $signature.TimeStamperCertificate) { throw "$($file.Name) signature has no timestamp" }
            Write-Host "$($file.Name) signed by $($signature.SignerCertificate.Subject)"
          }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: rc2fx-package-${{ matrix.os }}
          path: |
            target/package/rc2fx-windows-x64.zip
            target/package/rc2fx-windows-x64-setup.exe
            target/package/io.github.ibanks42.rc2fx-*-full.nupkg
            target/package/releases.win.json
          if-no-files-found: error

  # The AppImage is built in the AlmaLinux 8 container of `just package-check`
  # (glibc 2.28), so it runs on older distributions than the runner's, and is
  # then tested in clean containers of several distributions.
  linux:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Outside the work tree: package-check builds from a snapshot of it.
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-input
          path: ${{ runner.temp }}/release-input
      - name: Apply release version
        env:
          RELEASE_INPUT: ${{ runner.temp }}/release-input
        run: tar -xf "$RELEASE_INPUT/versioned.tar"
      - name: Build and test the AppImage
        env:
          CONTAINER_ENGINE: docker
        run: bash .github/scripts/package-check.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: rc2fx-package-linux
          path: |
            target/package-check/target/package/rc2fx-linux-x64.AppImage
            target/package-check/target/package/io.github.ibanks42.rc2fx-*-linux-full.nupkg
            target/package-check/target/package/releases.linux.json
            target/package-check/target/package/rc2fx-*-appimage-runtime-sources.tar.gz
          if-no-files-found: error

  # Beside the other platforms; only publish waits for it. If it fails, the
  # draft stays unpublished: re-run the failed jobs.
  macos:
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-input
          path: .release-input
      - name: Apply release version
        run: tar -xf .release-input/versioned.tar
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
          rustflags: ""
      - name: Install standard-library license notices
        run: rustup component add rust-docs
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-about@0.8.4
          fallback: none
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-desktop
          cache-bin: false
          cache-workspace-crates: true
          cache-on-failure: true
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Set up verified vpk
        run: bash .github/scripts/setup-vpk.sh
      - name: Load the Apple signing credentials
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
          MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: bash .github/scripts/macos-signing.sh
      - name: Build macOS release package
        env:
          RC2FX_RELEASE_BUILD: "1"
        run: cargo xtask package
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: macos-package
          path: |
            target/package/rc2fx-macos-arm64.zip
            target/package/rc2fx-macos-arm64.pkg
            target/package/io.github.ibanks42.rc2fx-*-osx-full.nupkg
            target/package/releases.osx.json
          if-no-files-found: error

  release:
    needs: [prepare, build, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-input
          path: target/release-input
      - name: Apply version and changelog
        run: tar -xf target/release-input/versioned.tar
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: rc2fx-package-*
          merge-multiple: true
          path: target/release-assets
      - name: Check archives and generate SHA256SUMS
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import zipfile
          import tarfile
          import tomllib

          directory = Path('target/release-assets')
          archives = sorted(directory.iterdir())
          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          prefix = f'rc2fx-{version}'
          sources_name = f'{prefix}-appimage-runtime-sources.tar.gz'
          pack = 'io.github.ibanks42.rc2fx'
          # Velopack's update packages and feeds keep its names: each feed names its package.
          feeds = {'releases.win.json': f'{pack}-{version}-full.nupkg',
                   'releases.linux.json': f'{pack}-{version}-linux-full.nupkg'}
          # Published names have no version, so releases/latest/download/NAME
          # always links the newest release.
          appimage = 'rc2fx-linux-x64.AppImage'
          expected = {appimage, 'rc2fx-windows-x64.zip', 'rc2fx-windows-x64-setup.exe', sources_name,
                      *feeds, *feeds.values()}
          names = {p.name for p in archives}
          assert names == expected, f'Missing or unexpected release packages: {sorted(names ^ expected)}'
          for archive in archives:
              if archive.name == sources_name:
                  with tarfile.open(archive, 'r:gz') as sources:
                      assert sources.getmembers(), 'Empty runtime source archive'
              elif archive.suffix == '.AppImage':
                  with archive.open('rb') as stream:
                      header = stream.read(11)
                  assert header[:4] == b'\x7fELF' and header[8:11] == b'AI\x02', 'Invalid AppImage'
              elif archive.suffix == '.exe':
                  with archive.open('rb') as stream:
                      assert stream.read(2) == b'MZ', 'Invalid Windows installer'
              elif archive.suffix == '.json':
                  # The app downloads the package this feed names and checks it against this digest.
                  package_name = feeds[archive.name]
                  assets = json.loads(archive.read_text())['Assets']
                  package = (directory / package_name).read_bytes()
                  assert [(a['PackageId'], a['Version'], a['Type'], a['FileName'], a['SHA256'].lower()) for a in assets] == [
                      (pack, version, 'Full', package_name, hashlib.sha256(package).hexdigest())
                  ], f'{archive.name} does not describe its update package'
              else:
                  assert archive.suffix in {'.zip', '.nupkg'}, archive
                  with zipfile.ZipFile(archive) as package:
                      assert package.testzip() is None
                      members = set(package.namelist())
                      if archive.name == feeds['releases.linux.json']:
                          # An AppImage update puts this file in place of the running AppImage.
                          inside = package.read(f'lib/app/{pack}.AppImage')
                          assert inside == (directory / appimage).read_bytes(), f'{archive.name} holds another AppImage'
                          continue
                  needed = {'lib/app/rc2fx.exe'} if archive.suffix == '.nupkg' else {'RC2FX.exe', 'Update.exe', 'current/rc2fx.exe'}
                  assert needed <= members, f'{archive.name} lacks {sorted(needed - members)}'
          sums = ''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in archives)
          (directory / 'SHA256SUMS').write_text(sums)
          print(sums)
          PY
      - name: Commit version and create local tag
        run: python3 .github/scripts/release.py commit
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-assets
          path: target/release-assets/
          if-no-files-found: error
      - name: Push version and tag
        if: ${{ !inputs.dry-run }}
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA" || {
            echo 'main changed during the build. Start a new release run.'
            exit 1
          }
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"
      - name: Create draft release and upload Linux and Windows packages
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          cat >> target/release-input/release-notes.md <<'EOF'

          <!-- rc2fx:macos-pending -->
          macOS build is pending. This draft will publish only after all platform packages are verified.
          <!-- /rc2fx:macos-pending -->
          EOF
          gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file target/release-input/release-notes.md
          gh release upload "$TAG" target/release-assets/*

  # Adds the macOS package to the draft, verifies every package and checksum,
  # and publishes the release as latest, last of all.
  publish:
    needs: [prepare, macos, release]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-publication
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: macos-package
          path: target/macos-assets
      - name: Complete, verify and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SOURCE: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 .github/scripts/macos_release.py publish --tag "$RELEASE_TAG" --source "$RELEASE_SOURCE" --package-dir target/macos-assets

  # Its own job, so a failed dispatch never holds up signing the release.
  docs:
    needs: [publish]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the release documentation deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run docs.yml --ref main -f source=latest-release

  # Signs the published release into the app update metadata, which the app
  # checks every update package against.
  app-metadata:
    needs: [prepare, publish]
    if: ${{ !inputs.dry-run }}
    permissions:
      contents: write
    uses: ./.github/workflows/app-metadata-sign.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      # Sign only the packages this run built and published.
      expect-artifacts: true
    secrets: inherit
