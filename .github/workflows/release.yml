name: Release
run-name: Release (${{ inputs.bump }})

on:
  workflow_dispatch:
    inputs:
      bump:
        description: App version bump (first release uses the checked-in version)
        type: choice
        default: patch
        options: [patch, minor, major]
      dry-run:
        description: Build without pushing or publishing
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Require main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/heads/main
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
          rustflags: ""
      - name: Install standard-library license notices
        run: rustup component add rust-docs
      - uses: actions/cache@v6.1.0
        id: zig-tool
        with:
          path: ~/.cache/rc2fx-release-tools/zig-0.16.0
          key: release-zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/scripts/setup-release-tools.sh') }}
      - name: Set up verified Zig
        run: bash .github/scripts/setup-release-tools.sh zig
      - uses: actions/cache@v6.1.0
        id: runtime-tools
        with:
          path: |
            ~/.cargo/bin/git-cliff*
            ~/.cargo/bin/cargo-zigbuild*
            ~/.cargo/bin/cargo-about*
          key: release-tools-${{ runner.os }}-${{ runner.arch }}-cliff2.14.1-zigbuild0.24.0-about0.8.4
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        if: steps.runtime-tools.outputs.cache-hit != 'true'
        with:
          tool: git-cliff@2.14.1,cargo-zigbuild@0.24.0,cargo-about@0.8.4
          fallback: none
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-runtime
          cache-bin: false
          cache-workspace-crates: true
          cache-on-failure: true
          workspaces: . -> target
      # The native crate has its own workspace but shares this target with
      # rc2fxd. Save it separately before rust-cache's root-workspace cleanup.
      - uses: actions/cache/restore@v6.1.0
        id: native-cache
        with:
          path: |
            ${{ runner.temp }}/rc2fx-native-cache
            ~/.cache/zig
            ~/.cache/cargo-zigbuild
          key: native-v1-${{ runner.os }}-${{ runner.arch }}-zig0.16-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.lock', 'crates/rc2fx-native/Cargo.lock', '**/Cargo.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            native-v1-${{ runner.os }}-${{ runner.arch }}-zig0.16-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.lock', 'crates/rc2fx-native/Cargo.lock', '**/Cargo.toml') }}-
            native-v1-${{ runner.os }}-${{ runner.arch }}-zig0.16-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-
      - name: Restore shared native build directory
        run: |
          if test -d "$RUNNER_TEMP/rc2fx-native-cache"; then
            rm -rf target/mixer-build
            mkdir -p target
            mv "$RUNNER_TEMP/rc2fx-native-cache" target/mixer-build
          fi
      - name: Test release versioning
        run: python3 .github/scripts/test_release.py
      - name: Bump version and prepare notes
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: python3 .github/scripts/release.py prepare --bump "$BUMP"
      - name: Test mixer release reuse
        run: python3 .github/scripts/test_mixer_release.py
      - name: Build or reuse immutable mixer release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/mixer_release.py prepare
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-input
          path: target/release-input/
          if-no-files-found: error
      - name: Preserve native build progress
        if: ${{ !cancelled() }}
        run: |
          if test -d target/mixer-build; then
            rm -rf "$RUNNER_TEMP/rc2fx-native-cache"
            mv target/mixer-build "$RUNNER_TEMP/rc2fx-native-cache"
          fi
      - uses: actions/cache/save@v6.1.0
        if: ${{ !cancelled() && steps.native-cache.outputs.cache-primary-key != '' && steps.native-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ${{ runner.temp }}/rc2fx-native-cache
            ~/.cache/zig
            ~/.cache/cargo-zigbuild
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang \
            libfontconfig1-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcb1-dev libvulkan1 libasound2-dev \
            libssl-dev libudev-dev libdbus-1-dev
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
          rustflags: ""
      - name: Install standard-library license notices
        run: rustup component add rust-docs
      - uses: actions/cache@v6.1.0
        id: desktop-tools
        with:
          path: ~/.cargo/bin/cargo-about*
          key: release-tools-${{ runner.os }}-${{ runner.arch }}-about0.8.4
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        if: steps.desktop-tools.outputs.cache-hit != 'true'
        with:
          tool: cargo-about@0.8.4
          fallback: none
      - uses: actions/cache@v6.1.0
        if: runner.os == 'Linux'
        with:
          path: ~/.cache/rc2fx-release-tools/appimage
          key: release-appimage-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/scripts/setup-release-tools.sh') }}
      - name: Set up verified AppImage tools
        if: runner.os == 'Linux'
        run: bash .github/scripts/setup-release-tools.sh appimage
      - name: Prepare AppImage runtime licenses and corresponding sources
        if: runner.os == 'Linux'
        run: |
          python3 .github/scripts/test_prepare_appimage_notices.py
          python3 .github/scripts/prepare-appimage-notices.py
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-input
          path: .release-input
      - name: Apply release version
        run: tar -xf .release-input/versioned.tar
      # Key the cache against the manifests actually being compiled.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-desktop
          cache-bin: false
          cache-workspace-crates: true
          cache-on-failure: true
      # The downloaded artifact lives outside target, so cached files cannot
      # overwrite it. Stage this run's verified runtime last.
      - name: Stage bundled runtime
        run: |
          rm -rf target/mixer
          mkdir -p target/mixer
          cp -R .release-input/runtime/. target/mixer/
          cp -R .release-input/xtask/mixer/. xtask/mixer/
      - name: Build release package
        env:
          RC2FX_RELEASE_BUILD: "1"
        run: cargo xtask package
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: rc2fx-package-${{ matrix.os }}
          path: |
            target/package/*.AppImage
            target/package/*.deb
            target/package/*.rpm
            target/package/*.zip
            target/package/rc2fx-appimage-runtime-sources.tar.gz
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-input
          path: target/release-input
      - name: Apply version and changelog
        run: tar -xf target/release-input/versioned.tar
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: rc2fx-package-*
          merge-multiple: true
          path: target/release-assets
      - name: Check archives and generate SHA256SUMS
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import zipfile
          import tarfile

          directory = Path('target/release-assets')
          archives = sorted(directory.iterdir())
          expected = {'rc2fx-linux-x64.AppImage', 'rc2fx-linux-x64.deb', 'rc2fx-linux-x64.rpm', 'rc2fx-appimage-runtime-sources.tar.gz'}
          if not os.environ.get('ACT'):
              expected |= {'rc2fx-windows-x64.zip', 'rc2fx-macos-arm64.zip'}
          assert {p.name for p in archives} == expected, 'Missing or unexpected release package'
          for archive in archives:
              assert archive.name.startswith('rc2fx-'), archive
              if archive.name == 'rc2fx-appimage-runtime-sources.tar.gz':
                  with tarfile.open(archive, 'r:gz') as sources:
                      assert sources.getmembers(), 'Empty runtime source archive'
              elif archive.suffix == '.AppImage':
                  with archive.open('rb') as stream:
                      header = stream.read(11)
                  assert header[:4] == b'\x7fELF' and header[8:11] == b'AI\x02', 'Invalid AppImage'
              elif archive.suffix in {'.deb', '.rpm'}:
                  with archive.open('rb') as stream:
                      header = stream.read(8)
                  assert header.startswith(b'!<arch>\n' if archive.suffix == '.deb' else bytes.fromhex('edabeedb')), 'Invalid native package'
              else:
                  assert archive.suffix == '.zip', archive
                  with zipfile.ZipFile(archive) as package:
                      assert package.testzip() is None
                      assert 'rc2fx/SHA256SUMS' in package.namelist()
          sums = ''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in archives)
          (directory / 'SHA256SUMS').write_text(sums)
          print(sums)
          PY
      - name: Commit version and create local tag
        run: python3 .github/scripts/release.py commit
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-assets
          path: target/release-assets/
          if-no-files-found: error
      - name: Push version and tag
        if: ${{ !inputs.dry-run && !env.ACT }}
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA" || {
            echo 'main changed during the build. Start a new release run.'
            exit 1
          }
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"
      - name: Publish immutable mixer release
        if: ${{ !inputs.dry-run && !env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/mixer_release.py publish
      - name: Create and publish GitHub release
        if: ${{ !inputs.dry-run && !env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file target/release-input/release-notes.md
          gh release upload "$TAG" target/release-assets/*
          gh release edit "$TAG" --draft=false --latest
