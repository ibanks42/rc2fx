name: Check

# Clippy on every platform the app ships for, with warnings as errors, so code
# that only compiles on one OS is linted there too. Linux, which the mixer runs,
# also checks formatting and runs the whole test suite. Nothing here builds the
# mixer runtime: `--no-default-features` turns off the app's embedded installer
# payload, which only real builds need.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sh .github/scripts/linux-build-deps.sh
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          rustflags: ""
          cache-key: check
          # The native library is its own workspace with its own target folder.
          cache-workspaces: |
            . -> target
            crates/rc2fx-native -> target
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Lint the workspace
        run: |
          cargo clippy --locked --workspace --all-targets --no-default-features -- -D warnings
          cargo clippy --locked -p rc2fx-app --all-targets --features mock-mixer -- -D warnings
      - name: Test the workspace
        # Linux is what the mixer runs, so the whole suite runs here.
        if: runner.os == 'Linux'
        run: cargo test --locked --workspace
      - name: Check the native library
        if: runner.os == 'Linux'
        run: cargo check --locked --manifest-path crates/rc2fx-native/Cargo.toml --all-targets
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        if: runner.os == 'Linux'
        with:
          tool: git-cliff@2.14.1,cargo-audit@0.22.2
          fallback: none
      - name: Audit dependencies for security advisories
        if: runner.os == 'Linux'
        # Fails on vulnerabilities; unmaintained-crate warnings are printed only.
        # Ignored advisories and their reasons live in .cargo/audit.toml.
        run: |
          cargo audit --file Cargo.lock
          cargo audit --file crates/rc2fx-native/Cargo.lock
          cargo audit --file crates/rc2fx-bench/Cargo.lock
      - name: Test release and documentation tooling
        if: runner.os == 'Linux'
        run: |
          python3 .github/scripts/test_release.py
          python3 .github/scripts/test_macos_release.py
          python3 .github/scripts/test_app_release.py
          python3 .github/scripts/test_docs_source.py
          python3 .github/scripts/test_update_history.py
      # Their Rust tests run with the workspace above.
      - name: Test the mixer scripts
        if: runner.os == 'Linux'
        run: for t in xtask/mixer/tests/*.py; do python3 "$t" || exit 1; done
