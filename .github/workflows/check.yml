name: Check

# Linux-only Rust workspace (including rc2fxd, standalone benchmark, and optional
# bench-kernels feature) runs in the AlmaLinux 8 release image. AArch64
# audio crates run natively on an Arm runner. Formatting and lints for every
# language run in the lint job using the tools pinned in mise.toml. Go desktop
# and xtask are vetted and tested across all shipped platforms, plus an
# AlmaLinux cgo build. Tooling runs the Python and C test suites on the host.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
  # Keep main's caches alive (GitHub evicts caches unused for 7 days).
  schedule:
    - cron: "23 6 * * 1,4"

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml

  linux:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      # Reap orphaned child processes so tests verifying process termination don't see zombies.
      options: --init
    defaults:
      run:
        shell: bash
    env:
      # Skip debuginfo for faster builds and smaller caches (also part of the cache key).
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Only main saves caches so PRs read main's cache without consuming cache quota.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: check-alma
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
          # The benchmark is a workspace of its own (for bench-kernels isolation).
          workspaces: |
            . -> target
            crates/rc2fx-bench -> target
      # Share cargo-ci.toml across steps so build scripts and proc-macros aren't rebuilt.
      - name: Lint the workspace
        run: |
          cargo clippy --config .github/cargo-ci.toml --locked --workspace --all-targets -- -D warnings
          # Workspace builds enable rc2fx-delta's test-only encoder; the mixer builds without it.
          cargo clippy --config .github/cargo-ci.toml --locked -p rc2fx-delta --lib -- -D warnings
      - name: Test the workspace
        run: cargo test --config .github/cargo-ci.toml --locked --workspace
      # Optional feature used by rc2fx-bench.
      - name: Lint the bench-kernels feature
        run: cargo clippy --config .github/cargo-ci.toml --locked -p rc2fx-dfn --features bench-kernels --all-targets -- -D warnings
      # gauge_binding.py loads the host rc2fx-native build via LD_AUDIT (skipped in tooling).
      - name: Test the native library bindings
        run: |
          cargo build --config .github/cargo-ci.toml --locked -p rc2fx-native
          RC2FX_REQUIRE_NATIVE=1 python3 mixer/scripts/tests/gauge_binding.py
      - name: Check the benchmark
        run: cargo check --config .github/cargo-ci.toml --locked --manifest-path crates/rc2fx-bench/Cargo.toml --all-targets

  # Native AArch64 lint/test for the mixer's audio crates and NEON code.
  # Empty rustflags below leaves RUSTFLAGS unset so .cargo/config.toml's
  # Cortex-A53 flags apply. golden_digests stays #[ignore] (libm-dependent).
  mixer-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      # Matches the linux job (no debuginfo, part of cache key).
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Uses rust-toolchain.toml; only main saves the cache.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          rustflags: ""
          cache-key: check-arm64
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint the mixer's audio crates
        run: cargo clippy --config .github/cargo-ci.toml --locked -p rc2fx-dsp -p rc2fx-dfn -p rc2fx-suppression --all-targets -- -D warnings
      - name: Test the mixer's audio crates
        run: cargo test --config .github/cargo-ci.toml --locked -p rc2fx-dsp -p rc2fx-dfn -p rc2fx-suppression
      # The bench-kernels arm of the NEON code.
      - name: Lint the bench-kernels feature
        run: cargo clippy --config .github/cargo-ci.toml --locked -p rc2fx-dfn --features bench-kernels --all-targets -- -D warnings

  # Formatting and lints for every language (go -C tools/xtask run . lint),
  # with the tools mise.toml pins.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6.0.0
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            desktop/go.sum
            tools/xtask/go.sum
      # rustfmt from rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          rustflags: ""
          cache: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: ruff shellcheck shfmt actionlint conda:clang-format
      - name: Check formatting and lints
        run: go -C tools/xtask run . lint

  # Host-side release, docs, mixer script, and C module tests.
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: git-cliff@2.14.1,cargo-audit@0.22.2
          fallback: none
      - name: Audit dependencies for security advisories
        # Fails on vulnerabilities only (unmaintained warnings are printed).
        # Ignored advisories live in .cargo/audit.toml.
        run: |
          cargo-audit audit --file Cargo.lock
          cargo-audit audit --file crates/rc2fx-bench/Cargo.lock
      - name: Test release and documentation tooling
        run: |
          python3 .github/scripts/test_release.py
          python3 .github/scripts/test_land_release.py
          python3 .github/scripts/test_app_release.py
          python3 .github/scripts/test_docs_source.py
          python3 .github/scripts/test_update_history.py
          python3 .github/scripts/test_mixer_version.py
          python3 .github/scripts/test_publish_mixer.py
          # Also verifies vpk, go -C tools/xtask run . fetch-velopack, and the packager agree on the Velopack pin.
          python3 .github/scripts/test_prepare_appimage_notices.py
      # gauge_binding.py skips here (no host rc2fx-native build); linux runs it.
      - name: Test the mixer scripts
        run: for t in mixer/scripts/tests/*.py; do python3 "$t" || exit 1; done
      # Built with host cc/c++, matching `just test-mixer`.
      - name: Test the jackd error recorder and the screen module
        run: |
          python3 -m unittest discover -s mixer/jackerr/tests -p 'test_*.py'
          python3 mixer/gui/test_gui_pacing.py

  # Go desktop packages (non-UI + CGO_ENABLED=0 xtask + UI build and tests
  # against prebuilt goui-kit and Velopack). Offscreen UI tests (app/uitest)
  # require goui-kit's diagnostic library and are skipped here. Unpinned
  # platforms still run all non-UI checks and skip the UI steps with a warning (release.yml fails on missing pins).
  desktop:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            platform: linux_x86_64
          - os: windows-latest
            target: windows-amd64
            platform: windows_x86_64
          - os: macos-latest
            target: darwin-universal
            platform: macos_universal
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Disable setup-go's built-in cache so only main saves to the cache.
      - uses: actions/setup-go@v6.0.0
        with:
          go-version-file: desktop/go.mod
          cache: false
      - name: Find the Go caches
        id: go-cache
        run: |
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4.2.3
        with:
          path: |
            ${{ steps.go-cache.outputs.mod }}
            ${{ steps.go-cache.outputs.build }}
          key: go-desktop-${{ runner.os }}-${{ hashFiles('desktop/go.sum', 'tools/xtask/go.sum') }}
          restore-keys: go-desktop-${{ runner.os }}-
      - name: Check the generated schema files
        if: runner.os == 'Linux'
        run: go -C ../tools/xtask run . schema --check
      - name: List everything but the UI
        run: go -C ../tools/xtask run . non-ui-packages > "$RUNNER_TEMP/non-ui-packages"
      - name: Vet and test everything but the UI
        run: |
          pkgs=$(cat "$RUNNER_TEMP/non-ui-packages")
          # shellcheck disable=SC2086
          CGO_ENABLED=0 go vet $pkgs
          # shellcheck disable=SC2086
          go test $pkgs
          go test -tags mockmixer ./transport/...
      # Touch an empty placeholder so go:embed succeeds during vet under -tags embedded.
      - name: Vet the development and embedded builds
        run: |
          : > installer/embed/payload/rc2fx-payload.bin
          pkgs=$(cat "$RUNNER_TEMP/non-ui-packages")
          # shellcheck disable=SC2086
          CGO_ENABLED=0 go vet -tags rc2fxdev,embedded $pkgs
          rm installer/embed/payload/rc2fx-payload.bin
      - name: Vet and test the xtask as go -C tools/xtask run . builds it
        working-directory: tools/xtask
        run: |
          CGO_ENABLED=0 go vet ./...
          CGO_ENABLED=0 go test ./...
      # Ensure tools/xtask stays pure Go (no cgo or goui-kit dependencies) and runs.
      - name: Check that xtask is pure Go and runs
        if: runner.os == 'Linux'
        run: |
          bad=$(CGO_ENABLED=0 go -C ../tools/xtask list -e -deps -f '{{if or .Error .DepsErrors .CgoFiles}}{{.ImportPath}}: {{.Error}}{{end}}' .)
          gk=$(CGO_ENABLED=0 go -C ../tools/xtask list -e -deps -f '{{.ImportPath}}' . | grep '^github\.com/ibanks42/goui-kit' || true)
          if [ -n "$bad$gk" ]; then
            printf 'tools/xtask must build without cgo or goui-kit:\n%s\n%s\n' "$bad" "$gk" >&2
            exit 1
          fi
          go -C ../tools/xtask run . help
      # Velopack cgo bindings are shared by the selfupdate vet and UI link check.
      - name: Fetch and vet the Velopack bindings
        env:
          TARGET: ${{ matrix.target }}
        run: |
          go -C ../tools/xtask run . fetch-velopack "$TARGET"
          CGO_ENABLED=1 go vet -tags velopack ./app/selfupdate/...
      - name: Check for a goui-kit pin
        id: pin
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          if grep -Eq "\"${PLATFORM}\": *\"[0-9a-f]{64}\"" ../config/goui-kit.json; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::config/goui-kit.json has no SHA-256 for $PLATFORM yet; the UI is not built here"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      # Runtime system libraries referenced by goui-kit's static library.
      - name: Install the goui-kit system libraries
        if: steps.pin.outputs.ready == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libxkbcommon0 libxkbcommon-x11-0 libxcb1 libfreetype6
      # Release link uses lld via MinGW gcc.
      - name: Check the C toolchain
        if: steps.pin.outputs.ready == 'true' && runner.os == 'Windows'
        run: gcc --version && ld.lld --version
      - name: Fetch goui-kit
        if: steps.pin.outputs.ready == 'true'
        env:
          TARGET: ${{ matrix.target }}
        run: go -C ../tools/xtask run . fetch-goui-kit "$TARGET"
      - name: Vet, build and test the UI
        if: steps.pin.outputs.ready == 'true'
        run: |
          # Link path for goui-kit's static library (used by package gk and tests).
          lib=$PWD/third_party/goui-kit/lib
          [ "$RUNNER_OS" != Windows ] || lib=$(cygpath -m "$lib")
          export CGO_LDFLAGS="-L$lib"
          export CGO_ENABLED=1
          # Pass gkstatic so package gk links the static library instead of loading the shared library at runtime.
          go vet -tags gkstatic ./app/... ./cmd/rc2fx
          go vet -tags gkstatic,mockmixer ./app/... ./cmd/rc2fx
          # Placeholder payload so go:embed passes vet under -tags embedded.
          : > installer/embed/payload/rc2fx-payload.bin
          go vet -tags gkstatic,rc2fxdev,embedded ./app/... ./cmd/rc2fx ./installer/...
          rm installer/embed/payload/rc2fx-payload.bin
          # Verify release link flags (including both slices on macOS).
          go -C ../tools/xtask run . check-ui-link "$RUNNER_TEMP/rc2fx-ui-check"
          # Package gk embeds the required Windows manifest in test binaries too.
          # Only test UI packages here; non-UI ./app/* subpackages already ran above.
          go test -tags gkstatic ./app ./cmd/rc2fx
      # Single vulnerability scan covering non-UI packages plus ./cmd/rc2fx when goui-kit is present.
      - name: Check dependencies for vulnerabilities
        if: runner.os == 'Linux'
        env:
          HAVE_GOUIKIT: ${{ steps.pin.outputs.ready }}
        run: |
          pkgs=$(cat "$RUNNER_TEMP/non-ui-packages")
          if [ "$HAVE_GOUIKIT" = true ]; then
            export CGO_ENABLED=1 CGO_LDFLAGS="-L$PWD/third_party/goui-kit/lib"
            # shellcheck disable=SC2086
            go run golang.org/x/vuln/cmd/govulncheck@v1.4.0 -tags gkstatic $pkgs ./cmd/rc2fx
          else
            # shellcheck disable=SC2086
            go run golang.org/x/vuln/cmd/govulncheck@v1.4.0 $pkgs
          fi
      - uses: actions/cache/save@v4.2.3
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            ${{ steps.go-cache.outputs.mod }}
            ${{ steps.go-cache.outputs.build }}
          key: go-desktop-${{ runner.os }}-${{ hashFiles('desktop/go.sum', 'tools/xtask/go.sum') }}

  # Build desktop cgo (UI + vendored libext2fs) inside the AlmaLinux 8 release
  # image to catch glibc 2.28 or container tool regressions before release.
  desktop-alma:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --init
    defaults:
      run:
        shell: bash
        working-directory: desktop
    env:
      # Avoid git dubious-ownership errors inside the container.
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Find the Go caches
        id: go-cache
        run: |
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4.2.3
        with:
          path: |
            ${{ steps.go-cache.outputs.mod }}
            ${{ steps.go-cache.outputs.build }}
          key: go-desktop-alma-${{ hashFiles('desktop/go.sum', '.github/scripts/package-check.Containerfile') }}
          restore-keys: go-desktop-alma-
      - name: Fetch goui-kit
        run: go -C ../tools/xtask run . fetch-goui-kit linux-amd64
      - name: Fetch the Velopack C library
        run: go -C ../tools/xtask run . fetch-velopack linux-amd64
      - name: Build the app
        run: go -C ../tools/xtask run . check-ui-link "$RUNNER_TEMP/rc2fx-alma-check"
      - name: Test the installer
        run: CGO_ENABLED=1 go test ./installer/... ./ext2fs/...
      - uses: actions/cache/save@v4.2.3
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            ${{ steps.go-cache.outputs.mod }}
            ${{ steps.go-cache.outputs.build }}
          key: go-desktop-alma-${{ hashFiles('desktop/go.sum', '.github/scripts/package-check.Containerfile') }}
