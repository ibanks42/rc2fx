name: Build image

# Builds and pushes the AlmaLinux 8 image (package-check.Containerfile) used by
# Check and Release to ghcr.io. Tags are derived from the Containerfile and
# rust-toolchain.toml via go -C tools/xtask run . build-image-tag, so callers skip rebuilds when
# nothing changed; the weekly schedule refreshes packages for security updates.
on:
  workflow_call:
    inputs:
      refresh:
        description: Rebuild even if the image exists
        type: boolean
        default: false
    outputs:
      image:
        description: The build image for this commit
        value: ${{ jobs.image.outputs.image }}
  workflow_dispatch:
    inputs:
      refresh:
        description: Rebuild even if the image exists
        type: boolean
        default: true
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6.0.0
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - name: Name the image
        id: tag
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          tag=$(go -C tools/xtask run . build-image-tag)
          echo "image=ghcr.io/${OWNER,,}/rc2fx-build:$tag" >> "$GITHUB_OUTPUT"
      - name: Sign in to the container registry
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      # Reuse an existing tag when called from Check/Release; manual and scheduled runs rebuild.
      - name: Build and push the image
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          REFRESH: ${{ inputs.refresh || github.event_name == 'schedule' }}
        run: |
          if [ "$REFRESH" != true ] && docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "Reusing $IMAGE"
            exit 0
          fi
          rust=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          docker build --build-arg "RUST_VERSION=$rust" --build-arg "PACKAGE_REFRESH=$(date +%s)" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t "$IMAGE" -f .github/scripts/package-check.Containerfile .github/scripts
          docker push "$IMAGE"
