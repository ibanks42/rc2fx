name: Build the macOS package
description: Build, sign and notarize RC2FX.app from a checkout with the release version applied, then upload the zip.

inputs:
  certificate:
    description: MACOS_CERTIFICATE
    required: false
  certificate-password:
    description: MACOS_CERTIFICATE_PASSWORD
    required: false
  notary-key:
    description: MACOS_NOTARY_KEY
    required: false
  notary-key-id:
    description: MACOS_NOTARY_KEY_ID
    required: false
  notary-issuer:
    description: MACOS_NOTARY_ISSUER
    required: false

runs:
  using: composite
  steps:
    - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      with:
        cache: false
        rustflags: ""
    - name: Install standard-library license notices
      shell: bash
      run: rustup component add rust-docs
    - uses: actions/cache@v6.1.0
      id: desktop-tools
      with:
        path: ~/.cargo/bin/cargo-about*
        key: release-tools-${{ runner.os }}-${{ runner.arch }}-about0.8.4
    - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
      if: steps.desktop-tools.outputs.cache-hit != 'true'
      with:
        tool: cargo-about@0.8.4
        fallback: none
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: release-desktop
        cache-bin: false
        cache-workspace-crates: true
        cache-on-failure: true
    - name: Load the Apple signing credentials
      shell: bash
      env:
        MACOS_CERTIFICATE: ${{ inputs.certificate }}
        MACOS_CERTIFICATE_PASSWORD: ${{ inputs.certificate-password }}
        MACOS_NOTARY_KEY: ${{ inputs.notary-key }}
        MACOS_NOTARY_KEY_ID: ${{ inputs.notary-key-id }}
        MACOS_NOTARY_ISSUER: ${{ inputs.notary-issuer }}
      run: bash .github/scripts/macos-signing.sh
    - name: Build macOS release package
      shell: bash
      env:
        RC2FX_RELEASE_BUILD: "1"
      run: cargo xtask package
    - uses: actions/upload-artifact@v7.0.2
      with:
        name: macos-package
        path: target/package/rc2fx-*-macos-arm64.zip
        if-no-files-found: error
        overwrite: true
